<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">

<link rel="stylesheet" href="https://unpkg.com/@wikimedia/codex-design-tokens@2.5.1/dist/theme-wikimedia-ui.css">
<link rel="stylesheet" href="https://unpkg.com/@wikimedia/codex@2.5.1/dist/codex.style.css">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
{%- for css in page.extra_css %}
<link rel="stylesheet" href="{{ css | relative_url }}">
{%- endfor %}

<script type="importmap">
{
  "imports": {
    "@chenglou/pretext": "https://unpkg.com/@chenglou/pretext@0.0.6/dist/layout.js"
  }
}
</script>
