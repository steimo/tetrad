<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}

<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
{%- for css in page.extra_css %}
<link rel="stylesheet" href="{{ css | relative_url }}">
{%- endfor %}

<script type="importmap">
{
  "imports": {
    "@chenglou/pretext": "https://unpkg.com/@chenglou/pretext@0.0.8/dist/layout.js"
  }
}
</script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "{{ site.title }}",
  "url": "{{ '/' | absolute_url }}",
  "applicationCategory": "EducationalApplication",
  "operatingSystem": "Any (web browser)",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
  "description": {{ site.description | jsonify }},
  "isAccessibleForFree": true,
  "about": {
    "@type": "Thing",
    "name": "Tetrad of media effects",
    "sameAs": "https://en.wikipedia.org/wiki/Tetrad_of_media_effects"
  }
}
</script>
