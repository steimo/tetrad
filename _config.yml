title: Tetrad of Media Effects
description: "A free, interactive tool based on Marshall McLuhan's Laws of Media. Enter any technology to explore its four simultaneous tetrad effects — what it enhances, obsolesces, retrieves, and reverses."
lang: en

url: "https://steimo.github.io"
baseurl: "/tetrad"

markdown: kramdown
kramdown:
  input: GFM

permalink: pretty

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - .gitignore
  - README.md
  - vendor/
